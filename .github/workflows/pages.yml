name: Publicar en GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'daphycel.html'
      - 'daphycel-cliente.html'
      - 'index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Armar el sitio (solo los 3 archivos publicos)
        run: |
          mkdir _site
          cp daphycel.html daphycel-cliente.html index.html _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
